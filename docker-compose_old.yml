version: "3.9"

services:
  document_extraction:
    image: ngoquan0904/tool_use_agent:1.0
    container_name: document_extraction_leadership
    ports:
      - "8080:8080"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      LLM_API: ${LLM_API}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      COLLECTION_NAME: ${COLLECTION_NAME}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION_NAME: ${S3_REGION_NAME}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - .:/app
    depends_on:
      - qdrant
      - minio
    command: ["uvicorn", "main_dev:app", "--host", "0.0.0.0", "--port", "8080"]

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant_leadership
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: quay.io/minio/minio
    container_name: minio_leadership
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  calendar_agent:
    profiles:
      - calendar
    image: ngoquan0904/leadership-assistant:1.0
    container_name: calendar_agent
    command: >
      python agents/sub_agent/main.py
      --agent-card agent_cards/calendar_agent.json
      --port 10002
      --host 0.0.0.0
    ports:
      - "10002:10002"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      client_secrets_file: /app/agent_cards/client_secret.json
    volumes:
      - .:/app
      - ./agent_cards/client_secret.json:/app/client_secret.json

  gmail_agent:
    profiles:
      - gmail
    image: ngoquan0904/leadership-assistant:1.0
    container_name: gmail_agent
    command: >
      python agents/sub_agent/main.py
      --agent-card agent_cards/gmail_agent.json
      --port 10003
      --host 0.0.0.0
    ports:
      - "10003:10003"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      client_secrets_file: /app/agent_cards/client_secret.json
      sender_email: ${sender_email}
      sender_password: ${sender_password}
    volumes:
      - .:/app
      - ./agent_cards/client_secret.json:/app/client_secret.json
    env_file:
      - ./agent_cards/gmail.env

  document_agent:
    profiles:
      - document
    image: ngoquan0904/leadership-assistant:1.0
    container_name: document_agent
    command: >
      python agents/sub_agent/main.py
      --agent-card agent_cards/document_agent.json
      --port 10004
      --host 0.0.0.0
    ports:
      - "10004:10004"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DOCUMENT_EXTRACTION_HOST: document_extraction
      DOCUMENT_EXTRACTION_PORT: 8080
    volumes:
      - .:/app

  orchestrator:
    image: ngoquan0904/leadership-assistant:1.0
    container_name: orchestrator
    command: ["uvicorn", "agents.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Default: no agent URLs. Start sub-agents when user enables them
      AGENT_URLS: '[]'
    # Note: sub-agents are profile-gated and should be started on-demand.
    # Remove automatic depends_on so orchestrator always starts independently.
      # - ek_agent
    volumes:
      - .:/app

  frontend:
    build: ./frontend
    container_name: frontend_leadership
    ports:
      - "8000:80"
    depends_on:
      - orchestrator

