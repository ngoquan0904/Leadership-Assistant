version: "3.9"

services:
  # Calendar Agent
  calendar_agent:
    build: .
    command: >
      python agents/calendar_langgraph/main.py
      --agent-card agent_cards/calendar_agent.json
      --port 10002
    ports:
      - "10002:10002"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - client_secrets_file=/app/agent_cards/client_secret.json
    volumes:
      - ./client_secret.json:/app/agent_cards/client_secret.json

  # Gmail Agent
  gmail_agent:
    build: .
    command: >
      python agents/calendar_langgraph/main.py
      --agent-card agent_cards/gmail_agent.json
      --port 10003
    ports:
      - "10003:10003"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - client_secrets_file=/app/agent_cards/client_secret.json
      - sender_email=${sender_email}
      - sender_password=${sender_password}
    volumes:
      - ./client_secret.json:/app/agent_cards/client_secret.json
  # HR Agent
  hr_agent:
    build: .
    command: >
      python agents/calendar_langgraph/main.py
      --agent-card agent_cards/hr_agent.json
      --port 10004
    ports:
      - "10004:10004"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    depends_on:
      - neo4j_service

  orchestrator:
    build: .
    command: >
      bash -c "cd agents && adk web"
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - calendar_agent
      - gmail_agent
      - hr_agent

  # Neo4j MCP service (dùng uvx mcp-neo4j-cypher)
  neo4j_service:
    image: neo4j:5.15
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  document_extraction:
    image: ngoquan0904/tool_use_agent:1.0
    container_name: document_extraction
    ports:
      - "8080:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LLM_API=${LLM_API}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - COLLECTION_NAME=${COLLECTION_NAME}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - S3_ACESS_KEY=${S3_ACESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION_NAME=${S3_REGION_NAME}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
volumes:
  neo4j_data:
  qdrant_data:
  minio_data:
